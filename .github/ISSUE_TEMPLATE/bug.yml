name: Bug report
description: Something on findacrib.com or in the app isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options: [Website (phone), Website (desktop), iPhone / iPad app, Alert email or push, Other]
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link or building address
      placeholder: https://findacrib.com/...
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Drag images here. Please crop out personal details.
