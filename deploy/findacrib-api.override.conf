# systemd drop-in for findacrib-api, installed by scripts/deploy_api.sh to
# /etc/systemd/system/findacrib-api.service.d/override.conf.
#
# One worker process with threads, not two processes. The dashboard routes
# memoise their expensive helpers in-process, and with two workers every
# request landed on a cold copy half the time — the owner's range clicks
# measured 7–9 s each on 2026-09-18 with a warm memo sitting in the other
# worker. The app is I/O-bound (PostgREST, Stripe, APNs); its module-level
# caches already take locks and it already runs its own background threads.
# This also returns ~260 MB on a 2 GB droplet that had 200 MB free.
[Service]
ExecStart=
ExecStart=/root/findacrib-api/venv/bin/gunicorn -w 1 --threads 8 --timeout 60 --no-control-socket -b 127.0.0.1:8010 api_server:app

# Unprivileged since 2026-09-26. The API holds the Supabase service-role and
# Stripe keys and answers the open internet, so it no longer runs as root.
# Its code dir /root/findacrib-api is root:findacrib 0750 and read-only to it;
# .env is root:findacrib 0640. It writes only its StateDirectory
# (/var/lib/findacrib-api): the AI-crawl cache, redirected there by FAC_AI_CACHE.
# What it reads outside its own dir, and how it is allowed to:
#   /var/log/nginx/*.log                 group adm
#   /root/Find-A-Crib/growth/*.json      ACL u:findacrib:x on /root
#   /var/www/*                           world-readable already
# Since 2026-10-06 it no longer reads NEMO's, Trent's or Crease's data: those
# tabs moved to the owner dashboard's agent (repo divinedavis/owner-dashboard,
# unit owner-metrics-agent, user ownermetrics), so the nemo/trents groups,
# their cache paths and the .gsc_key.json ACL were dropped.
# No bytecode writes (PYTHONDONTWRITEBYTECODE) and no gunicorn control socket
# (it would default to root's /run/user/0).
User=findacrib
Group=findacrib
SupplementaryGroups=adm
StateDirectory=findacrib-api
Environment=HOME=/var/lib/findacrib-api
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=FAC_AI_CACHE=/var/lib/findacrib-api/ai_crawls.json
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
