# host-aware access log format (combined + vhost) for per-site logs.
#
# $request_time is appended last, and deliberately so: every existing parser and
# every rotated .gz archive reads positionally from the left, so a new field on
# the end is invisible to them while old lines stay parseable against the same
# regex. The same append-don't-insert rule is why the nemo format below carries
# its cookie field at the end.
#
# It is here because a "the site hangs sometimes" report in Aug 2026 could not
# be answered from these logs at all — request duration had never been recorded,
# so slow responses were indistinguishable from fast ones after the fact and the
# question had to be settled by reproducing the failure instead. $request_time
# measures until the last byte is written to the client, so a slow client shows
# up as a slow request; read it alongside $body_bytes_sent, since a short read
# with a long time is a stalled download rather than a slow server.
#
# $upstream_response_time follows it for the same reason one step on: a 10.1 s
# /api/dashboard-nemo showed up here and $request_time alone could not say
# whether the app was slow or the browser was slow to read a 760-byte reply.
# The pair answers that outright — upstream ≈ request means the app, upstream
# much smaller than request means the client. It logs "-" for anything nginx
# served itself without a proxy, which is most of these two sites.
# $cookie_crease_owner is last, appended under the same rule: Crease's owner
# opt-out is a cookie (/?owner=1), and until it reached this log the traffic
# tile could only exclude the owner by address. An address is not a device —
# his home IP changed on 19 Aug 2026 and the dashboard immediately began
# counting him as a visitor to his own site, which is exactly the failure NEMO
# hit and fixed the same way. Empty for every other host on this box.
log_format site "$host $remote_addr - $remote_user [$time_local] "
                "\"$request\" $status $body_bytes_sent "
                "\"$http_referer\" \"$http_user_agent\" $request_time "
                "$upstream_response_time \"$cookie_crease_owner\"";

# NEMO: combined + the owner-opt-out cookie as a trailing field.
# growth/metrics.py drops any request carrying it, so the developer's own
# devices stay out of the traffic numbers no matter what address they are on —
# an IP list can't follow a phone through iCloud Private Relay or a hotspot.
# The field is appended, not inserted, so log lines written before this change
# still parse against the same regex.
log_format nemo '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" "$cookie_nemo_owner"';

# Same shape as `nemo`, but logs $uri (path only) instead of $request (which
# includes the query string). Used for /booking/ and /owner/, whose links carry
# their own credential in the query — the uid+sig on a management link IS the
# authority to cancel or move that booking, and the owner schedule sig is a
# permanent key to the whole calendar. Logging those verbatim puts working
# credentials in a plaintext file that is read by the growth engine, rotated
# into .gz archives, and readable by anyone with shell access.
#
# Field count and ordering are unchanged so growth/metrics.py parses these lines
# with the same regex.
log_format nemo_noargs '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" "$cookie_nemo_owner"';

# Counter-plate QR scans, and nothing else. Its own file rather than a filter
# over the site log for two reasons, and the second is the one that matters:
# it stays small enough for the dashboard to read on the request path, and it
# records the people who pointed a camera at a plate and closed the tab before
# any JavaScript ran. Those never reach the visits table, and the gap between
# this count and that one is the measurement the signage card is built on —
# scans are what the printed QUESTION earned, sessions are what the site did.
#
# No address field. The site's own log already carries one, so this adds no
# exposure by leaving it out, and nothing downstream needs it: unique-visitor
# counting happens against the fac_vid cookie once the visitor lands, and a
# scan count is a count of cameras, not of people.
log_format fac_qr '$time_iso8601 $status $request_uri "$http_user_agent"';
