# Rate-limit zones, keyed on the real TCP peer ($binary_remote_addr) — NOT
# X-Forwarded-For, whose left-most value is attacker-controlled. These servers
# set no set_real_ip_from, so $binary_remote_addr is the true client IP.
#
# req_api:    general dynamic/API endpoints (generous — a normal client won't
#             approach 20 r/s; burst absorbs page bursts).
# req_strict: auth/login and abuse-sensitive endpoints.
limit_req_zone $binary_remote_addr zone=req_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=req_strict:10m rate=5r/s;

# A throttled request is "Too Many Requests", not "Service Unavailable": 429
# tells a client to back off and retry, where nginx's default 503 reads as an
# outage and invites aggressive retries that make the flood worse. Applies to
# every site on the box that uses these zones — all of which want the same.
limit_req_status 429;
