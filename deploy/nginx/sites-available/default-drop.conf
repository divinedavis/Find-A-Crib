# Requests for any name this box does not serve (scanners hitting the bare IP)
# get the connection closed. findacrib.com is the only site on this droplet.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
# Same for HTTPS (security audit 2026-10-07, L5): without an HTTPS
# default_server, a TLS handshake for ANY name (or the bare IP) was answered
# with the findacrib.com certificate and served by that vhost. Refuse the
# handshake instead (nginx >= 1.19.4; no certificate needed).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
