# fac_vid: first-party anonymous visitor id for the traffic report. Set by the
# server (not JS) so it survives Safari ITP's 7-day cap on script-writable
# storage; only sent when the browser doesn't already have one. An empty map
# value makes nginx omit the Set-Cookie header entirely.
map $cookie_fac_vid $fac_vid_cookie {
    ""      "fac_vid=$request_id; Max-Age=31536000; Path=/; Secure; SameSite=Lax";
    default "";
}

# SEO-audit crawlers blocked by the owner 2026-11-02 (~45k req/day, no visitors).
# robots.txt disallows them too (growth/techniques.py BLOCKED_SEO_BOTS); this is
# the backstop for any that ignore it. /robots.txt stays readable to them.
map $http_user_agent $fac_blocked_bot {
    default 0;
    ~*(QlyzeBot|SemrushBot|SiteAuditBot|AhrefsBot|AhrefsSiteAudit) 1;
}

server {
    server_name findacrib.com;

    set $fac_block $fac_blocked_bot;
    if ($fac_blocked_asn) { set $fac_block 1; }   # conf.d/findacrib_blocked_asn.conf
    if ($uri = /robots.txt) { set $fac_block 0; }
    if ($fac_block) { return 403; }

    # Google Search Console ownership token. Served by nginx because this vhost
    # proxies an app rather than a directory, so there is no docroot to put it
    # in. Google re-checks it and un-verifies the property if it disappears.
    location = /googlef630845c68076fd4.html {
        default_type text/html;
        return 200 "google-site-verification: googlef630845c68076fd4.html";
    }


    root /var/www/rent-map;
    index index.html;
    access_log /var/log/nginx/findacrib.access.log site;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Set-Cookie $fac_vid_cookie;
    # CSP: inline script/style are still allowed (the app is inline-heavy), but
    # external code can only load from these exact hosts and data can only be
    # POSTed to Supabase + Google analytics — kills CDN-injection & exfiltration.
    # data.cityofnewyork.us is read-only Socrata: the building detail sheet pulls
    # each building's HPD violation text on demand (too big to ship in the JSON).
    # add_header does NOT inherit into locations that set their own headers, so
    # this is repeated in the = /index.html block below (the SPA document).
    # 'unsafe-eval' dropped 2026-10-07 (security audit L6): Playwright on desktop
    # Chromium, Pixel 7, iPhone and iPad WebKit showed no CSP violation, the map
    # drew its pins and Mediavine/Journey ads loaded without it. The Look Around
    # frame below KEEPS it (MapKit's spc-look-around.js builds functions with
    # new Function) under its own CSP scoped to cdn.apple-mapkit.com. script-src
    # keeps https: — the ad auction loads scripts from 100+ exchange hosts.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https:; media-src 'self' blob: https:; font-src 'self' data: https:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;
    # Journey by Mediavine (2026-09-29): ads.txt is theirs, kept current on their side.
    location = /ads.txt { return 301 https://adstxt.journeymv.com/sites/c80d90dc-8d39-4cc8-ae1f-67cf301e7a16/ads.txt; }

    location ~* \.(py|log)$ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }
    # Internal files that live in the docroot because crons run from it
    # (venv/, scripts/, hcr_chain.pem, *.py) or were left behind by hand edits
    # (*.bak*, *.before-*). None is ever loaded by the site. agent_phones.json
    # is the Plus-only phone cache and buildings_hpd.json (a pipeline
    # intermediate) carried the same numbers — both bypassed the paywall
    # (security audit 2026-09-25). Regex order matters: keep this above the
    # json/js locations below.
    location ~* (\.bak[^/]*$|\.before-[^/]*$|\.orig$|\.sh$|\.pem$|\.md$|^/venv/|^/scripts/|/__pycache__/|^/agent_phones\.json$|^/buildings(_hpd|_geo|_geo_nta)?\.json$|^/changed_urls\.txt$) { deny all; return 404; }

    # The Google Ads campaign points at /rent-stabilized/... — a path that
    # never existed here (SEO pages live under /building/, /neighborhood/,
    # /borough/). The homepage IS the rent-stabilized map, so send ad
    # clicks there instead of a 404 (which got the ad disapproved).
    # The owner dashboard moved to divinedavis.com/dashboard/ on 2026-09-18
    # (source still dhcr-map dashboard/, shipped by scripts/deploy_dashboard.sh).
    # Its data still comes from /api/dashboard-* here, via a proxy on that host.
    location ^~ /dashboard {
        return 301 https://divinedavis.com$request_uri;
    }

    location ^~ /rent-stabilized {
        return 301 /;
    }

    # Short, typeable channel tags. A comment on TikTok saying "use findacrib.com"
    # is untrackable by construction: the reader types the domain into their own
    # browser, so there is no referrer and nothing distinguishes them from
    # direct traffic. "findacrib.com/tt" is no harder to type and every visit
    # through it is attributable — the tracking snippet records
    # location.pathname + location.search, so ?src= lands in visits.path.
    # 302, not 301: a permanent redirect gets cached by the browser and the
    # second visit never touches the server, which would undercount returns.
    # iOS app sign-in. ASWebAuthenticationSession names the host of the URL it
    # opens in its consent dialog, so the app starts Supabase's OAuth flow via
    # findacrib.com ("Find A Crib wants to use findacrib.com to sign in") and
    # this bounces it to the real GoTrue authorize endpoint. Fixed target host,
    # path + query passed through — not an open redirect.
    location = /auth/v1/authorize { return 302 https://dbaifotzwlxjvsxjohjt.supabase.co$request_uri; }

    location = /tt { return 302 /?src=tiktok; }
    location = /ig { return 302 /?src=instagram; }
    location = /yt { return 302 /?src=youtube; }
    location = /rd { return 302 /?src=reddit; }

    # Printed QR pieces. The code on a counter card encodes findacrib.com/c and
    # nothing about where it lands, which is the only reason a permanent
    # engraved plate is safe to make: the destination is this line, not the
    # object, and it can be repointed without reprinting anything already
    # sitting on a counter. Add a numbered path per venue when there are enough
    # placements to tell apart (/c1, /c2 ...) — they can all point here today
    # and be split later without touching the plastic.
    # /c/<code> is one plate on one counter: the letter is which question the
    # plate asks (a = "Is your building rent-stabilized?", b = "Find
    # rent-stabilized apartments") and the digits are the placement. Two
    # counters sharing a code means neither one's scans can be read, which is
    # the entire reason the number is there.
    #
    # Bounded regex, not a catch-all: an unbounded /c/(.*) would put anything a
    # scanner asked for into ?src=, and that value is echoed back through the
    # dashboard. Only a letter and up to three digits ever reach the redirect.
    location = /c {
        access_log /var/log/nginx/findacrib-qr.log fac_qr;
        return 302 /?src=qr-counter;
    }
    # Quoted: nginx's own parser reads an unquoted { as the start of a block,
    # so the regex has to be a string or it is truncated at the brace.
    location ~ "^/c/([ab][0-9]{1,3})$" {
        access_log /var/log/nginx/findacrib-qr.log fac_qr;
        return 302 /?src=qr-$1;
    }

    # A subway platform screen gets a WORD, not a code: findacrib.com/rent is
    # what a rider can remember until they have signal. It hops through
    # /c/a21 rather than tagging itself, so the scan log, the placement rows
    # and the dashboard all see one code for the whole flight — and typing the
    # word versus scanning the code stays visible as /rent in the access log.
    location = /rent {
        return 302 /c/a21;
    }

    # The NFC chip in a stand gets /t/<code>, the printed code beside it gets
    # /c/<code>. Same plate, same `src=qr-<code>`, so every per-plate, per-arm
    # and per-venue number on the dashboard keeps working untouched — but the
    # request path and the extra `via=tap` make a tap and a scan two findings
    # instead of one. Worth separating: they are different amounts of effort
    # from the person at the counter, and if taps beat scans on the same card
    # that is an argument for buying chips rather than for changing the sign.
    location ~ "^/t/([ab][0-9]{1,3})$" {
        access_log /var/log/nginx/findacrib-qr.log fac_qr;
        return 302 "/?src=qr-$1&via=tap";
    }

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        add_header Set-Cookie $fac_vid_cookie;
    }

    # city map pages (/sf/, /la/) — same app document, same no-cache + headers
    # as the NYC index.html above (the index directive internally redirects
    # /sf/ -> /sf/index.html, which re-matches into this block)
    location ~ ^/(?:sf|la)/index\.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=()" always;
        add_header Content-Security-Policy $csp always;
        add_header Set-Cookie $fac_vid_cookie;
    }

    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # config.js holds rotating API keys — always revalidate so a key swap
    # reaches returning visitors immediately (index.html also cache-busts ?v=)
    # Apple Look Around runs inside one same-origin document per photo.
    # Its renderer permission and CDN access are scoped to this endpoint.
    location = /static/apple-street-frame.html {
        # Versioned URL (?v=N): cache it hard. Every street photo loads this
        # document in its own iframe and each was paying a revalidation first.
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.apple-mapkit.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.apple-mapkit.com; connect-src 'self' https://*.apple-mapkit.com; font-src 'self' data: https://cdn.apple-mapkit.com; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Data blobs: browser-cache for an hour (refreshes revalidate -> 304), and
    # serve a pre-built .gz when one exists (gzip_static). Only precompress
    # files that change rarely (buildings.min.json): gzip_static serves the .gz
    # blindly, so a stale .gz next to a nightly-updated JSON would serve old
    # data. After scp'ing a new buildings.min.json run:
    #   gzip -9 -kf /var/www/rent-map/buildings.min.json
    location ~* \.(?:json|geojson)$ {
        gzip_static on;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Developer API — proxied to the Flask/gunicorn service on :8010. The
    # trailing slash on proxy_pass strips /api/, so /api/v1/... -> /v1/...
    # Lease review (Find A Crib Plus, 2026-10-11) takes a lease PDF upload, so
    # this one path gets 8m; every other /api/ call keeps nginx's 1m default
    # (and Flask's 16 KB cap, which the route raises only after the Plus check).
    location = /api/ai/lease-review {
        limit_req zone=req_api burst=5 nodelay;
        client_max_body_size 8m;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8010/ai/lease-review;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=req_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS is set by the Flask app (api_server.py), scoped to the read-only
        # /v1 data endpoints only. Do NOT add it here: a blanket header would
        # duplicate ACAO (browsers reject two values) and re-expose the
        # same-origin-only /developers/ portal cross-origin.
    }

    # Paid building reports. Served by the same Flask app, but on a clean
    # public path: /report/<token> is what buyers get emailed and keep, so it
    # should not carry /api/ in it. Rewritten to the app's /reports/ route.
    location ^~ /report/ {
        rewrite ^/report/(.*)$ /reports/$1 break;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/findacrib.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/findacrib.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 443 ssl http2;
    server_name www.findacrib.com;
    ssl_certificate /etc/letsencrypt/live/findacrib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/findacrib.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://findacrib.com$request_uri;
}

server {
    listen 80;
    server_name findacrib.com www.findacrib.com;
    return 301 https://findacrib.com$request_uri;
}
