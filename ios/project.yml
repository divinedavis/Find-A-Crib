name: FindACrib
options:
  bundleIdPrefix: com.divinedavis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "18"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  FindACrib:
    type: application
    platform: iOS
    # One source folder: XcodeGen routes .swift to Compile Sources and every
    # other extension (.xcassets, .ttf, .json, .gz) to Copy Bundle Resources.
    # A separate `resources:` key is NOT part of XcodeGen's schema — it is
    # silently ignored, and shipped a bundle with no fonts, data or icon.
    sources:
      - path: FindACrib
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: FindACrib/Info.plist
      properties:
        CFBundleDisplayName: Find A Crib
        # System dialogs (ASWebAuthenticationSession consent, Sign in with
        # Apple) show CFBundleName, which otherwise defaults to the product
        # name "FindACrib".
        CFBundleName: Find A Crib
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: LaunchNavy
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        # Source Sans 3 (SIL OFL 1.1) — the humanist sans StreetEasy's app is
        # set in. Registered here so Font.custom() resolves the PostScript names.
        UIAppFonts:
          - SourceSans3-Regular.ttf
          - SourceSans3-Semibold.ttf
          - SourceSans3-Bold.ttf
          - SourceSans3-Black.ttf
        NSLocationWhenInUseUsageDescription: Find A Crib uses your location to show rent-stabilized buildings near you on the map.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Google sign-in runs Supabase's web OAuth flow in an
        # ASWebAuthenticationSession and comes back on this scheme.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.divinedavis.findacrib.auth
            CFBundleURLSchemes:
              - findacrib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.findacrib
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG89RY4W6R
        ENABLE_PREVIEWS: YES
        # Without this the AccentColor asset is dead weight and every .tint
        # falls back to system blue (see reference_ios_accent_color_unwired).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: FindACrib/FindACrib.entitlements
      properties:
        # Sign in with Apple. APPLE_ID_AUTH is enabled on the App ID by
        # scripts/register_in_asc.py; the two halves must agree or signing
        # fails with an error naming neither.
        com.apple.developer.applesignin:
          - Default

  FindACribTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FindACribTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.findacrib.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FindACrib

  FindACribUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FindACribUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.findacrib.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FindACrib

schemes:
  FindACrib:
    build:
      targets:
        FindACrib: all
        FindACribTests: [test]
        FindACribUITests: [test]
    test:
      targets:
        - FindACribTests
        - FindACribUITests
      gatherCoverageData: false
    run:
      config: Debug
      # Local StoreKit products for the simulator; not bundled in the app.
      storeKitConfiguration: Plus.storekit
    archive:
      config: Release
