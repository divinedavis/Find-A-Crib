<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Find A Crib 15s promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<!--
  15-second vertical promo (1080x1920). Every motion is a CSS animation with an
  absolute delay; render.py pauses them all and seeks document.getAnimations()
  to each frame's time, so the export is frame-exact. Open in a browser with
  ?play to watch it live.
-->
<style>
  :root {
    --teal: #2f7a8a;
    --navy: #163c47;
    --ink: #0b1418;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Inter Tight", system-ui, sans-serif; color: var(--ink); }

  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .dark { background: radial-gradient(120% 80% at 70% 30%, #0f2a31 0%, #050a0c 60%, #000 100%); }
  .light { background: #fff; }
  @keyframes on { from { opacity: 1 } to { opacity: 1 } }

  /* ---------- 3D phone ---------- */
  .stage { position: absolute; perspective: 2400px; }
  .phone { position: relative; width: 560px; height: 1217px; transform-style: preserve-3d; }
  .slab { position: absolute; inset: 0; border-radius: 92px; background: linear-gradient(135deg, #3c4a4f, #0d1517 40%, #2a3b40 70%, #0b1214); }
  .face {
    position: absolute; inset: 0; border-radius: 92px; padding: 16px;
    background: linear-gradient(135deg, #59707a, #1a2529 30%, #0e1517 70%, #4e646d);
    transform: translateZ(26px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
  }
  .screen { width: 100%; height: 100%; border-radius: 78px; overflow: hidden; background: #fff; position: relative; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .island { position: absolute; top: 34px; left: 50%; width: 170px; height: 50px; margin-left: -85px; background: #000; border-radius: 30px; z-index: 3; }
  .glare { position: absolute; inset: 0; border-radius: 78px; z-index: 2;
    background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.28) 45%, rgba(255,255,255,0) 60%);
    background-size: 300% 100%; }

  /* ---------- type ---------- */
  .line { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 22px; white-space: nowrap; }
  .big { font-weight: 800; font-size: 108px; letter-spacing: -4px; line-height: 1; }
  .mid { font-weight: 700; font-size: 84px; letter-spacing: -2.5px; line-height: 1; }
  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; letter-spacing: -1px; }
  .teal { color: var(--teal); }
  .grad { background: linear-gradient(90deg, #2f7a8a, #4fb3a9 50%, #2f7a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { height: 132px; border-radius: 66px; overflow: hidden; width: 0; flex: none; background: #ddd; }
  .pill div { width: 100%; height: 100%; background-repeat: no-repeat; background-size: cover; }
  .w { display: inline-block; }

  @keyframes rise { from { transform: translateY(90px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeout { from { opacity: 1 } to { opacity: 0 } }
  @keyframes pillOpen { from { width: 0 } to { width: 260px } }
  @keyframes pillWide { from { width: 0 } to { width: 420px } }
  @keyframes pillPan { from { background-position: 50% 30% } to { background-position: 50% 60% } }
  @keyframes zoomIn { from { transform: scale(1.25) } to { transform: scale(1) } }
  @keyframes swap { 0% { opacity: 0; transform: translateY(60px) } 15% { opacity: 1; transform: none } 85% { opacity: 1; transform: none } 100% { opacity: 0; transform: translateY(-60px) } }

  /* Scene 1 — cinematic close-up */
  @keyframes s1turn { from { transform: rotateY(-48deg) rotateX(14deg) rotateZ(-8deg) translateZ(0) } to { transform: rotateY(-18deg) rotateX(6deg) rotateZ(-3deg) translateZ(260px) } }
  @keyframes s1light { from { opacity: 0 } 40% { opacity: .9 } to { opacity: .5 } }
  @keyframes glareSweep { from { background-position: 120% 0 } to { background-position: -40% 0 } }

  /* Scene 3 phone slide */
  @keyframes slideIn { from { transform: translateX(900px) rotateY(-30deg) } to { transform: translateX(0) rotateY(-12deg) rotateX(4deg) } }
  /* Scene 5 phone tilt */
  @keyframes tiltUp { from { transform: translateY(700px) rotateX(30deg) rotateZ(6deg) } to { transform: translateY(0) rotateX(8deg) rotateZ(-4deg) } }
  /* Scene 6 alert */
  @keyframes s6turn { from { transform: rotateY(30deg) rotateX(8deg) } to { transform: rotateY(-8deg) rotateX(4deg) } }
  @keyframes drop { 0% { transform: translateY(-260px); opacity: 0 } 60% { transform: translateY(14px); opacity: 1 } 100% { transform: none; opacity: 1 } }
  /* End card */
  @keyframes pop { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.06); opacity: 1 } 100% { transform: scale(1) } }

  .notif {
    position: absolute; left: 24px; right: 24px; top: 96px; z-index: 4;
    background: rgba(245,247,248,.96); border-radius: 36px; padding: 22px 26px; display: flex; gap: 18px; align-items: center;
    box-shadow: 0 20px 40px rgba(0,0,0,.35);
    font-size: 25px; line-height: 1.25; color: #111;
  }
  .notif img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
  .notif b { font-weight: 700; }
  .notif small { color: #666; font-size: 21px; }
</style>
</head>
<body>

<!-- ============ 0.0 – 2.4  Dark cinematic close-up ============ -->
<section class="scene dark" style="animation: on 2.4s linear 0s">
  <div style="position:absolute;inset:0;background:radial-gradient(40% 30% at 30% 40%, rgba(79,179,169,.55), transparent 70%);animation: s1light 2.4s ease-out 0s both"></div>
  <div class="stage" style="left:330px;top:330px;transform:scale(1.2);transform-origin:50% 40%">
    <div class="phone" style="animation: s1turn 2.4s cubic-bezier(.2,.7,.2,1) 0s both">
      <div class="slab"></div><div class="slab" style="transform:translateZ(9px)"></div><div class="slab" style="transform:translateZ(18px)"></div>
      <div class="face"><div class="screen"><div class="island"></div>
        <div class="glare" style="animation: glareSweep 1.6s ease-in-out .5s both"></div>
        <img src="../../ios/marketing/raw/home.png">
      </div></div>
    </div>
  </div>
</section>

<!-- ============ 2.4 – 4.6  "Every [pill] building" / "rent-stabilized" ============ -->
<section class="scene light" style="animation: on 2.2s linear 2.4s">
  <div class="line big" style="top:760px">
    <span class="w" style="animation: rise .35s cubic-bezier(.2,.8,.2,1) 2.45s both">Every</span>
    <span class="pill" style="animation: pillOpen .45s cubic-bezier(.3,.8,.2,1) 2.7s both">
      <div style="background-image:url(img/building-b.jpg);animation: pillPan 1.8s linear 2.7s both"></div>
    </span>
    <span class="w" style="animation: rise .35s cubic-bezier(.2,.8,.2,1) 2.55s both">building</span>
  </div>
  <div class="line big" style="top:910px">
    <span class="w serif grad" style="font-size:150px;animation: rise .4s cubic-bezier(.2,.8,.2,1) 3.1s both">rent-stabilized</span>
  </div>
  <div class="line mid" style="top:1110px;color:#7a8a8f;font-weight:500;font-size:56px;letter-spacing:-1px">
    <span class="w" style="animation: fade .35s ease 3.6s both">47,000+ in New York City</span>
  </div>
</section>

<!-- ============ 4.6 – 6.8  "on one map" + phone slides in ============ -->
<section class="scene light" style="animation: on 2.2s linear 4.6s">
  <div class="line big" style="top:250px">
    <span class="w" style="animation: rise .35s cubic-bezier(.2,.8,.2,1) 4.65s both">All on</span>
    <span class="w serif teal" style="font-size:150px;animation: rise .35s cubic-bezier(.2,.8,.2,1) 4.8s both">one map</span>
  </div>
  <div class="stage" style="left:260px;top:520px">
    <div class="phone" style="animation: slideIn .8s cubic-bezier(.2,.8,.2,1) 5.0s both">
      <div class="slab"></div><div class="slab" style="transform:translateZ(9px)"></div><div class="slab" style="transform:translateZ(18px)"></div>
      <div class="face"><div class="screen"><div class="island"></div><img src="../../ios/marketing/raw/map.png"></div></div>
    </div>
  </div>
</section>

<!-- ============ 6.8 – 8.8  Housing lotteries ============ -->
<section class="scene light" style="animation: on 2.0s linear 6.8s">
  <div class="line big" style="top:720px">
    <span class="w" style="animation: rise .35s cubic-bezier(.2,.8,.2,1) 6.85s both">Housing</span>
    <span class="pill" style="animation: pillOpen .45s cubic-bezier(.3,.8,.2,1) 7.05s both">
      <div style="background-image:url(img/building-a.jpg);animation: pillPan 1.6s linear 7.05s both"></div>
    </span>
  </div>
  <div class="line big" style="top:880px">
    <span class="w serif grad" style="font-size:160px;animation: rise .4s cubic-bezier(.2,.8,.2,1) 7.3s both">lotteries</span>
  </div>
  <div class="line mid" style="top:1090px;color:#7a8a8f;font-weight:500;font-size:56px;letter-spacing:-1px">
    <span class="w" style="animation: fade .35s ease 7.8s both">open now, in one list</span>
  </div>
</section>

<!-- ============ 8.8 – 11.2  Rapid word flips over the detail screen ============ -->
<section class="scene light" style="animation: on 2.4s linear 8.8s">
  <div class="stage" style="left:260px;top:700px">
    <div class="phone" style="animation: tiltUp .7s cubic-bezier(.2,.8,.2,1) 8.85s both">
      <div class="slab"></div><div class="slab" style="transform:translateZ(9px)"></div><div class="slab" style="transform:translateZ(18px)"></div>
      <div class="face"><div class="screen"><div class="island"></div><img src="../../ios/marketing/raw/detail.png"></div></div>
    </div>
  </div>
  <div class="line big" style="top:300px"><span class="w" style="animation: swap .6s ease 8.9s both">Violations.</span></div>
  <div class="line big" style="top:300px"><span class="w serif teal" style="font-size:150px;animation: swap .6s ease 9.5s both">Look Around.</span></div>
  <div class="line big" style="top:300px"><span class="w" style="animation: swap .6s ease 10.1s both">Asking rents.</span></div>
  <div class="line big" style="top:300px"><span class="w serif grad" style="font-size:150px;animation: swap .55s ease 10.65s both">Landlords.</span></div>
</section>

<!-- ============ 11.2 – 13.2  Alerts on dark ============ -->
<section class="scene dark" style="animation: on 2.0s linear 11.2s">
  <div class="line big" style="top:190px;color:#fff">
    <span class="w" style="animation: rise .35s cubic-bezier(.2,.8,.2,1) 11.25s both">Know</span>
    <span class="w serif" style="font-size:150px;color:#7fd3c8;animation: rise .35s cubic-bezier(.2,.8,.2,1) 11.4s both">first.</span>
  </div>
  <div class="stage" style="left:260px;top:450px">
    <div class="phone" style="animation: s6turn 2s cubic-bezier(.2,.7,.2,1) 11.2s both">
      <div class="slab"></div><div class="slab" style="transform:translateZ(9px)"></div><div class="slab" style="transform:translateZ(18px)"></div>
      <div class="face"><div class="screen"><div class="island"></div>
        <div class="notif" style="animation: drop .5s cubic-bezier(.2,.8,.2,1) 11.75s both">
          <img src="../../ios/FindACrib/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png">
          <div><b>New rent-stabilized listing</b> <small>now</small><br>40 Tehama St, Kensington · $1,200</div>
        </div>
        <img src="../../ios/marketing/raw/results.png" style="filter:brightness(.9)">
      </div></div>
    </div>
  </div>
</section>

<!-- ============ 13.2 – 15.0  End card ============ -->
<section class="scene" style="background:var(--navy);animation: on 1.8s linear 13.2s">
  <div style="position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 42%, rgba(79,179,169,.35), transparent 70%)"></div>
  <div class="line" style="top:600px">
    <img src="../../ios/FindACrib/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png" style="width:300px;height:300px;border-radius:68px;box-shadow:0 30px 60px rgba(0,0,0,.4);animation: pop .55s cubic-bezier(.2,.8,.2,1) 13.25s both">
  </div>
  <div class="line big" style="top:990px;color:#fff;font-size:128px">
    <span class="w" style="animation: rise .4s cubic-bezier(.2,.8,.2,1) 13.5s both">Find A Crib</span>
  </div>
  <div class="line" style="top:1150px;color:#bfe3de;font-size:52px;font-weight:500">
    <span class="w" style="animation: fade .4s ease 13.85s both">On the App Store · findacrib.com</span>
  </div>
</section>

<script>
  const DURATION = 15;
  window.seek = (t) => {
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
  };
  window.ready = Promise.all([
    document.fonts.ready,
    ...[...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })),
  ]);
  if (location.search.includes('play')) {
    const t0 = performance.now();
    const tick = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
    ready.then(tick);
  }
</script>
</body>
</html>
