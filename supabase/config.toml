# Only the per-function settings matter here: `supabase functions deploy`
# reads them so a redeploy can't silently re-enable the JWT gate.
project_id = "dbaifotzwlxjvsxjohjt"

# Stripe can't send a Supabase JWT; the function verifies the Stripe
# HMAC signature instead. Deploying with verify_jwt=true 401'd every
# webhook from ~7/27 to 9/25 and dropped live Plus purchases.
[functions.stripe-webhook]
verify_jwt = false

# Checkout must stay behind the platform JWT gate: it opens a Stripe session
# for the calling user. Pinned explicitly so a redeploy can't drop it.
[functions.create-checkout]
# Off since the 2026-10-25 key rotation: the platform gate checks tokens
# against the legacy JWT secret, which breaks once user tokens are signed by
# the new asymmetric key. The function calls auth.getUser() itself and
# answers 401 without a signed-in user.
verify_jwt = false

# App Store Server Notifications V2 (2026-10-07): Apple sends no Supabase JWT;
# the function verifies Apple's JWS chain instead. Must stay false or every
# renewal/expiry notification 401s.
[functions.apple-notifications]
verify_jwt = false

[functions.apple-subscription]
# Off since the 2026-10-25 key rotation: the function verifies the user
# itself (auth.getUser(), 401 otherwise); the platform gate uses the legacy
# JWT secret, which breaks once user tokens are asymmetric.
verify_jwt = false
